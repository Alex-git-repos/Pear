<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pear</title>
</head>
<body>
  <style>
    body {
      font-family: "Segoe UI", "Gill Sans", sans-serif;
      background-image: radial-gradient(
        circle,
        rgba(36, 37, 41, 1) 0%,
        rgba(59, 45, 44, 1) 50%,
        rgba(99, 45, 36, 1) 100%
      );
    }
    h1 {
      color: white;
      font-weight: 200;
    }
    /* Landing page only. Over a proxied page the same controls are built inside a shadow root (CreateBar). */
    #PearID {
      font-family: "Segoe UI", "Gill Sans", sans-serif;
      font-weight: 200;
      color: rgb(119, 119, 119);
      font-size: 2cap;
      background-color: black;
      border-radius: 10px;
      padding: 4px;
    }
    #PearFetchBtn {
      padding: 10px;
      font-family: "Segoe UI", "Gill Sans", sans-serif;
      font-weight: 500;
      color: white;
      background-color: black;
      border-radius: 10px;
      border-style: solid;
      border-color: lightgrey;
      border-width: 2px;
    }
    #PearFetchBtn:active {
      border-color: grey;
      border-width: 1px;
    }
  </style>
  <div id="PearShim">
    <h1>Enter Pear Resource to use</h1>
    <input type="text" id="PearID">
    <button id="PearFetchBtn">Load</button>
  </div>

  <script>
  // Wrapped in an IIFE so nothing here lands in global scope. Top-level
  // const/let can't be re-declared if this script runs more than once in
  // the same window (e.g. when htmx re-inserts it).
  (() => {
    const Self = document.currentScript;
    // Taken now, before a proxied page has run: such a page's runtime shim wraps getElementById() (and
    // friends) to hash ids and classes, so afterwards these lookups would no longer find our own elements.
    const GetById = Document.prototype.getElementById.bind(document);
    // Config comes from cookies (set elsewhere; they must NOT be HttpOnly,
    // or document.cookie can't see them):
    //   PEAR_FRONTEND - absolute URI of the frontend folder, e.g. http://localhost:5500/Frontend/
    //   PEAR_BACKEND  - absolute URI of the backend,         e.g. http://localhost:80
    function GetCookie(Name) {
      for (const Pair of document.cookie.split("; ")) {
        const EqIndex = Pair.indexOf("=");
        if (EqIndex === -1 || Pair.slice(0, EqIndex) !== Name) continue;

        const RawValue = Pair.slice(EqIndex + 1);
        try {
          return decodeURIComponent(RawValue);
        } catch {
          return RawValue;
        }
      }
      return null;
    }

    const PEAR_BACKEND = GetCookie("PEAR_BACKEND");
    // new URL("./Main.html", base) only stays in the folder if base ends in "/".
    const PEAR_FRONTEND = GetCookie("PEAR_FRONTEND")?.replace(/\/*$/, "/") ?? null;

    // -----------------------------------------------------------------------
    // The proxied page's URL: resource_uri, with the proxied page's own query params folded into it
    //
    // A proxied page's query string belongs INSIDE resource_uri (percent-encoded, so its "?" and "&" are
    // not mistaken for ours). It ends up outside when something submits or navigates to
    //   Main.html?q=cats&sca_esv=abc&resource_uri=https%3A%2F%2Fwww.google.com%2Fsearch
    // for example a GET form (the browser serializes the fields into the query of the form's action URL), or a
    // script that did location.search += "&x=1". Here those params are moved into the proxied URL and the
    // address bar is rewritten to the canonical Main.html?resource_uri=<whole url>, so reloading, bookmarking
    // and copying the link all keep working. A param that the proxied URL already has is replaced, the way a
    // GET submission replaces its action's query; repeated params are all kept.
    // Returns null when there is no resource_uri.
    // -----------------------------------------------------------------------
    function ResolveResourceUri() {
      const Params = new URLSearchParams(window.location.search);
      const Raw = Params.get("resource_uri");
      if (Raw === null) return null;

      const Extras = new Map();
      for (const [Key, Value] of Params) {
        if (Key === "resource_uri") continue;
        if (!Extras.has(Key)) Extras.set(Key, []);
        Extras.get(Key).push(Value);
      }
      if (Extras.size === 0) return Raw;

      let Target;
      try {
        Target = new URL(Raw);
      } catch {
        return Raw; // not a URL: the caller reports it as an invalid resource
      }
      for (const [Key, Values] of Extras) {
        Target.searchParams.delete(Key);
        for (const Value of Values) Target.searchParams.append(Key, Value);
      }
      // A fragment is never sent to a server; the one on Main.html (if any) stays where it is.
      Target.hash = "";

      try {
        const Canonical = new URL(window.location.href);
        Canonical.search = "";
        Canonical.searchParams.set("resource_uri", Target.href);
        history.replaceState(history.state, "", Canonical.href);
      } catch (Err) {
        console.warn("Could not rewrite the address bar:", Err);
      }
      return Target.href;
    }

    const ResourceUri = ResolveResourceUri();

    // -----------------------------------------------------------------------
    // The bar shown over a proxied page
    //
    // The page we show is somebody else's: its CSS, its selectors and its scripts must not be able to touch
    // the bar, and the bar must not take space from (or cover) the page. So:
    //  - the controls live in a shadow root, which page stylesheets and document.querySelector() cannot reach,
    //    and their styles use plain element selectors (the shim hashes class/id, which would break class names);
    //  - the host element is styled inline with !important. Inline !important beats any !important in a page
    //    stylesheet, and "all: initial" first wipes whatever the page's rules would otherwise inherit into it;
    //  - the host sits in normal flow between <head> and <body> (outside <body>, so selectors like
    //    "body > :first-child" miss it), position: sticky keeps it on screen while scrolling, and being in
    //    flow means the page starts below the bar instead of underneath it.
    // -----------------------------------------------------------------------
    const BAR_HOST_STYLE = [
      ["all", "initial"],
      ["display", "block"],
      ["position", "sticky"],
      ["top", "0"],
      ["left", "0"],
      ["width", "100%"],
      ["flex", "none"],
      ["margin", "0"],
      ["padding", "0"],
      ["border", "0"],
      ["z-index", "2147483647"],
      ["isolation", "isolate"]
    ];

    const BAR_STYLES = `
      * {
        box-sizing: border-box;
      }
      div {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
        background-color: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(6px);
      }
      input {
        flex: 1;
        min-width: 0;
        font-family: "Segoe UI", "Gill Sans", sans-serif;
        font-weight: 200;
        color: rgb(119, 119, 119);
        font-size: 2cap;
        background-color: black;
        border-radius: 10px;
        padding: 4px;
      }
      button {
        padding: 10px;
        font-family: "Segoe UI", "Gill Sans", sans-serif;
        font-weight: 500;
        color: white;
        background-color: black;
        border-radius: 10px;
        border-style: solid;
        border-color: lightgrey;
        border-width: 2px;
      }
      button:active {
        border-color: grey;
        border-width: 1px;
      }
    `;

    function CreateBar() {
      const Host = document.createElement("pear-shim");
      for (const [Property, Value] of BAR_HOST_STYLE) {
        Host.style.setProperty(Property, Value, "important");
      }

      // "closed": the proxied page's scripts get no handle on it through Host.shadowRoot
      const Root = Host.attachShadow({ mode: "closed" });

      const Style = document.createElement("style");
      Style.textContent = BAR_STYLES;

      const Bar = document.createElement("div");
      const Input = document.createElement("input");
      Input.type = "text";
      Input.spellcheck = false;
      Input.autocomplete = "off";
      const Button = document.createElement("button");
      Button.type = "button";
      Button.textContent = "Load";
      Bar.append(Input, Button);
      Root.append(Style, Bar);

      // Typing in the bar must not trigger the page's own keyboard shortcuts.
      for (const Type of ["keydown", "keyup", "keypress"]) {
        Root.addEventListener(Type, (EvnArgs) => EvnArgs.stopPropagation());
      }

      return { Host, Input, Button };
    }

    function MountBar(Host) {
      const Place = () => {
        const Html = document.documentElement;
        // document.body may be null for odd pages; insertBefore(x, null) then appends.
        if (Host.parentNode !== Html) Html.insertBefore(Host, document.body);
      };
      Place();
      // A page that rebuilds its document tree must not be able to drop the bar.
      new MutationObserver(Place).observe(document.documentElement, { childList: true });

      // In-page links (#section) would scroll their target to the very top, under the bar.
      if (typeof ResizeObserver === "function") {
        new ResizeObserver(() => {
          document.documentElement.style.setProperty("scroll-padding-top", `${Host.offsetHeight}px`, "important");
        }).observe(Host);
      }
    }

    function IsValidUrl(Value) {
      try {
        new URL(Value);
        return true;
      } catch {
        return false;
      }
    }

    function BindShim(PearFetchBtn, UrlBarContent) {
      if (!PearFetchBtn || !UrlBarContent) {
        console.warn("Pear shim elements not found; skipping bind.");
        return;
      }

      PearFetchBtn.addEventListener("click", () => {
        if (!PEAR_FRONTEND || !IsValidUrl(PEAR_FRONTEND)) {
          alert("PEAR_FRONTEND cookie is missing or invalid!");
          return;
        }
        if (!IsValidUrl(UrlBarContent.value)) {
          alert("Invalid Resource!");
          return;
        }

        const RedirectUrl = new URL("./Main.html", PEAR_FRONTEND);
        // searchParams.set() already percent-encodes; don't encode twice.
        RedirectUrl.searchParams.set("resource_uri", UrlBarContent.value);
        window.location.href = RedirectUrl.href;
      });

      UrlBarContent.addEventListener("keydown", (EvnArgs) => {
        if (EvnArgs.key === "Enter" && !EvnArgs.isComposing) PearFetchBtn.click();
      });
    }

    async function FetchReplace() {
      if (!PEAR_BACKEND || !IsValidUrl(PEAR_BACKEND)) {
        alert("PEAR_BACKEND cookie is missing or invalid!");
        return false;
      }
      if (!IsValidUrl(ResourceUri)) {
        alert("Invalid Resource!");
        return false;
      }

      const FetchUrl = new URL("/api/proxy", PEAR_BACKEND);
      FetchUrl.searchParams.set("content_url", ResourceUri);

      let PearApiResponse;
      try {
        PearApiResponse = await fetch(FetchUrl, {
          method: "GET",
          credentials: "include"
        });
      } catch (Err) {
        console.error(Err);
        alert("Failed to reach the Pear backend.");
        return false;
      }
      if (!PearApiResponse.ok) {
        alert(`Proxy request failed (${PearApiResponse.status})`);
        return false;
      }

      // Replaces the whole document, including the landing page.
      document.documentElement.innerHTML = await PearApiResponse.text();

      function ReparseScripts(Root = document) {
        for (const Old of Root.querySelectorAll("script")) {
          if (Old === Self) continue;
          const New = document.createElement("script");
          for (const A of Old.attributes) New.setAttribute(A.name, A.value);
          New.textContent = Old.textContent;
          New.async = false; // keep original execution order for external scripts
          Old.replaceWith(New);
        }
      }

      ReparseScripts();
      return true;
    }

    if (ResourceUri) {
      FetchReplace()
        .then((Replaced) => {
          if (!Replaced) {
            // The landing page is still on the page, so keep it usable.
            BindShim(GetById("PearFetchBtn"), GetById("PearID"));
            return;
          }

          // The document was replaced, so the landing page is gone; build the bar fresh.
          const Bar = CreateBar();
          MountBar(Bar.Host);
          BindShim(Bar.Button, Bar.Input);
        })
        .catch((Err) => {
          console.error(Err);
          alert("Failed to load resource.");
        });
    } else {
      BindShim(GetById("PearFetchBtn"), GetById("PearID"));
    }
  })();
  </script>
</body>
</html>
